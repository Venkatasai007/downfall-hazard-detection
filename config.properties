    # INPUT
    input.source=video
    input.video_path=./backpack.mp4
    input.isaac_image_topic=/camera/rgb/image_raw
    input.isaac_encoding=bgr8
    input.reconnect_enabled=true
    input.reconnect_attempts=5

    # YOLO
    model.path=yolo26n.pt
    model.conf_threshold=0.20
    model.iou_threshold=0.45
    model.device=0
    model.image_size=640

    # BASELINE
    baseline.enabled=true
    baseline.observation_duration_sec=3.0
    baseline.minimum_observations=5
    baseline.stationary_iou_threshold=0.70
    baseline.max_stationary_displacement_px=3.0

    # CORRIDOR
    corridor.yellow_line_p1=512,220
    corridor.yellow_line_p2=512,575
    corridor.geometry_mode=pixel

    # AMR
    amr.base_half_width=40
    amr.safety_margin=26
    amr.base_half_width_m=0.50
    amr.safety_margin_m=0.325

    # CALIBRATION
    calibration.homography_enabled=false
    calibration.homography_matrix=

    # MOTION
    motion.descend_min_vy=5.0
    motion.rest_frames=8
    motion.rest_max_velocity=1.5
    motion.velocity_units=pixels_per_second
    motion.minimum_displacement=5.0
    motion.velocity_smoothing_window=5
    motion.preassociation_iou_threshold=0.10
    motion.preassociation_distance_px=100.0

    # TRACKING
    tracking.maximum_missed_frames=10
    tracking.minimum_track_observations=3
    tracking.track_match_iou=0.30
    tracking.track_match_distance_px=100.0
    tracking.maximum_active_tracks=100
    tracking.byte_track_high_threshold=0.50
    tracking.byte_track_low_threshold=0.10
    tracking.byte_track_match_threshold=0.80
    tracking.track_buffer_frames=30

    # LANDING
    landing.rest_frames=15
    landing.rest_max_velocity=15.0
    landing.maximum_detection_gap_frames=2
    landing.minimum_track_age_frames=5
    landing.position_stability_threshold_px=5.0

    # RISK
    risk.high_overlap_threshold=10.0
    risk.medium_overlap_min=0.0
    risk.geometry_epsilon=0.000001

    # STORAGE
    storage.evidence_base_dir=./evidence
    storage.buffer_duration_sec=10
    storage.post_event_duration_sec=5
    storage.camera_fps=30
    storage.video_codec=mp4v
    storage.jpeg_quality=95
    storage.disk_min_free_mb=500

    # DISPLAY
    display.enabled=true
    display.window_name=AMR Downfall Monitoring
    display.show_fps=true
    display.show_trajectories=true
    display.show_confidence=true
    display.show_track_ids=true
    display.show_velocity=true
    display.show_baseline_debris=true

    # PERFORMANCE
    performance.frame_skip=0
    performance.max_processing_fps=0
